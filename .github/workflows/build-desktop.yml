name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-universal
            os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - id: macos-intel
            os: macos-latest
            bundles: dmg
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - id: macos-apple-silicon
            os: macos-latest
            bundles: dmg
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - id: windows-x64
            os: windows-latest
            bundles: nsis,msi
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - id: windows-x86
            os: windows-latest
            bundles: nsis,msi
            target: i686-pc-windows-msvc
            rust_targets: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.id }}
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.id }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No installers found" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "MDLite $GITHUB_REF_NAME" --notes-from-tag
          fi
